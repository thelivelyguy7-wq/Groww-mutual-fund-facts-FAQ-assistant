<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Mutual Fund AI - FAQ Assistant</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#c7c6c6",
                        "secondary": "#5f5e5e",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#474646",
                        "primary-fixed-dim": "#2fe0aa",
                        "tertiary": "#5e5e5e",
                        "inverse-primary": "#2fe0aa",
                        "on-primary-container": "#00533c",
                        "surface": "#f8f9fa",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#f3f4f5",
                        "primary-fixed": "#59fdc5",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "surface-container-highest": "#e1e3e4",
                        "secondary-container": "#e5e2e1",
                        "on-surface": "#191c1d",
                        "tertiary-fixed": "#e3e2e2",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#00d09c",
                        "primary": "#006c4f",
                        "secondary-fixed": "#e5e2e1",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-tertiary-fixed-variant": "#464747",
                        "background": "#f8f9fa",
                        "outline": "#6b7b72",
                        "outline-variant": "#bacac1",
                        "on-surface-variant": "#3c4a43",
                        "inverse-on-surface": "#f0f1f2",
                        "on-primary-fixed-variant": "#00513b",
                        "surface-container": "#edeeef",
                        "surface-dim": "#d9dadb",
                        "surface-variant": "#e1e3e4",
                        "surface-container-high": "#e7e8e9",
                        "surface-tint": "#006c4f",
                        "on-tertiary-container": "#484848",
                        "on-primary-fixed": "#002116",
                        "tertiary-container": "#b8b7b7",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "on-background": "#191c1d",
                        "on-tertiary-fixed": "#1b1c1c",
                        "on-secondary-container": "#656464"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "margin-desktop": "40px",
                        "sidebar-width": "320px",
                        "chat-max-width": "800px",
                        "stack-gap": "12px",
                        "gutter": "24px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],

                    "fontSize": {

                    }
                }
            }
        }
    </script>
    <style>
        .dot-flashing {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: #006c4f;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: .5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -12px;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: #006c4f;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            width: 8px;
            height: 8px;
            border-radius: 4px;
            background-color: #006c4f;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #006c4f; }
            50%, 100% { background-color: rgba(0, 108, 79, 0.2); }
        }
        
        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background-color: #e5e2e1; border-radius: 3px; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Markdown Styles */
        .markdown a { color: #006c4f; text-decoration: underline; }
        .markdown p { margin-bottom: 0.5rem; }
        .markdown p:last-child { margin-bottom: 0; }
        .markdown ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
        .markdown table { border-collapse: collapse; width: 100%; margin-bottom: 0.5rem; }
        .markdown th, .markdown td { border: 1px solid #e5e7eb; padding: 0.25rem 0.5rem; text-align: left; }
        .markdown em { font-size: 0.85rem; color: #6b7280; font-style: normal; display: block; margin-top: 0.75rem; border-top: 1px solid #e5e7eb; padding-top: 0.5rem; }
    </style>
</head>
<body class="bg-surface dark:bg-[#1a1d1e] font-body-md text-on-surface dark:text-[#eef0ef] h-screen overflow-hidden flex selection:bg-primary-container selection:text-on-primary-container">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // The design system only defines light-mode surface tokens; these are the
        // dark-mode equivalents used by the informational pages and Settings toggle.
        const CARD = "bg-surface-container-lowest dark:bg-[#212425] rounded-lg border border-outline-variant dark:border-[#3a3f3d]";
        const MUTED = "text-on-surface-variant dark:text-[#a9b3af]";
        const ICON_BOX = "bg-surface-container dark:bg-[#262a2b]";

        function NavItem({ icon, label, active, onClick, small }) {
            return (
                <a
                    href="#"
                    onClick={(e) => { e.preventDefault(); onClick(); }}
                    className={`flex items-center gap-3 rounded-lg transition-colors ${small ? 'py-2 px-4' : 'py-3 px-4'} ${
                        active
                            ? 'text-primary dark:text-primary-fixed-dim font-bold border-l-4 border-primary dark:border-primary-fixed-dim bg-surface-container-low dark:bg-[#2b2f30]'
                            : 'text-on-surface-variant dark:text-[#a9b3af] hover:text-on-surface dark:hover:text-[#eef0ef] hover:bg-surface-container dark:hover:bg-[#262a2b]'
                    }`}
                >
                    <span className={`material-symbols-outlined ${small ? 'text-sm' : ''}`}>{icon}</span>
                    <span className={small ? 'font-label-sm text-label-sm' : 'font-label-md text-label-md'}>{label}</span>
                </a>
            );
        }

        function PageHeader({ icon, title, subtitle }) {
            return (
                <div className="mb-8">
                    <div className={`w-14 h-14 ${ICON_BOX} rounded-2xl flex items-center justify-center mb-4 text-primary dark:text-primary-fixed-dim`}>
                        <span className="material-symbols-outlined text-2xl">{icon}</span>
                    </div>
                    <h2 className="font-headline-lg text-headline-lg mb-2">{title}</h2>
                    <p className={`font-body-md text-body-md ${MUTED}`}>{subtitle}</p>
                </div>
            );
        }

        function InfoCard({ icon, title, children }) {
            return (
                <div className={`${CARD} p-6`}>
                    {icon && (
                        <div className={`w-10 h-10 rounded-lg ${ICON_BOX} flex items-center justify-center text-primary dark:text-primary-fixed-dim mb-4`}>
                            <span className="material-symbols-outlined text-lg">{icon}</span>
                        </div>
                    )}
                    {title && <h3 className="font-headline-md text-headline-md mb-2">{title}</h3>}
                    <div className={`font-body-md text-body-md ${MUTED}`}>{children}</div>
                </div>
            );
        }

        function DisclaimerNote({ icon, children }) {
            return (
                <div className="bg-[#FFFBEB] border-l-4 border-error rounded-lg p-4 flex gap-3">
                    <span className="material-symbols-outlined text-error">{icon || 'warning'}</span>
                    <p className="font-label-md text-label-md text-on-surface">{children}</p>
                </div>
            );
        }

        function MarketTrendsPage() {
            const categories = [
                { icon: 'show_chart', name: 'Equity Funds', desc: 'Invest primarily in company stocks. Higher growth potential paired with higher short-term volatility — typically suited for long-term goals (5+ years).' },
                { icon: 'account_balance', name: 'Debt Funds', desc: 'Invest in bonds and other fixed-income instruments. Lower volatility than equity, aiming for steadier returns over shorter horizons.' },
                { icon: 'balance', name: 'Hybrid Funds', desc: 'Blend equity and debt in a single scheme to balance growth potential against downside protection.' },
                { icon: 'diamond', name: 'Gold & Commodity Funds', desc: 'Track the price of gold or other commodities, often used as a hedge against inflation and market uncertainty.' },
            ];
            return (
                <div className="max-w-4xl mx-auto">
                    <PageHeader icon="trending_up" title="Market Trends" subtitle="A quick educational overview of how major mutual fund categories typically behave. This is not live market data." />
                    <div className="grid sm:grid-cols-2 gap-4 mb-8">
                        {categories.map((c, i) => <InfoCard key={i} icon={c.icon} title={c.name}>{c.desc}</InfoCard>)}
                    </div>
                    <DisclaimerNote icon="info">For up-to-date NAVs, returns, or scheme-specific facts, ask a question in New Chat — this page only covers general category behavior.</DisclaimerNote>
                </div>
            );
        }

        function TaxSaversPage() {
            return (
                <div className="max-w-4xl mx-auto">
                    <PageHeader icon="account_balance" title="Tax Savers" subtitle="Common mutual fund options used for tax planning under the Indian Income Tax Act." />
                    <div className="grid sm:grid-cols-2 gap-4">
                        <InfoCard icon="savings" title="ELSS (Equity Linked Savings Scheme)">
                            Qualifies for a deduction of up to ₹1.5 lakh/year under Section 80C. Carries the shortest mandatory lock-in of any 80C option — 3 years. Returns are market-linked since ELSS invests predominantly in equities.
                        </InfoCard>
                        <InfoCard icon="schedule" title="Lock-in Comparison">
                            ELSS: 3 years · PPF: 15 years · Tax-saving FDs: 5 years · NSC: 5 years. A shorter lock-in means faster access to your money, but more exposure to market swings for ELSS.
                        </InfoCard>
                        <InfoCard icon="percent" title="Section 80C Limit">
                            The combined deduction across all eligible instruments (ELSS, PPF, EPF, life insurance premiums, etc.) is capped at ₹1.5 lakh per financial year under the old tax regime.
                        </InfoCard>
                        <InfoCard icon="query_stats" title="Before You Invest">
                            Check the expense ratio, fund manager track record, and exit load. Ask the assistant for scheme-specific factual details on any ELSS fund.
                        </InfoCard>
                    </div>
                </div>
            );
        }

        function PortfolioAnalysisPage() {
            const profiles = [
                { name: 'Conservative', equity: 20, debt: 70, gold: 10 },
                { name: 'Moderate', equity: 50, debt: 40, gold: 10 },
                { name: 'Aggressive', equity: 80, debt: 15, gold: 5 },
            ];
            return (
                <div className="max-w-4xl mx-auto">
                    <PageHeader icon="analytics" title="Portfolio Analysis" subtitle="This assistant doesn't have access to your personal holdings. Below are illustrative allocation patterns by risk profile to use as a reference point." />
                    <div className="flex flex-col gap-4 mb-8">
                        {profiles.map((p, i) => (
                            <div key={i} className={`${CARD} p-6`}>
                                <h3 className="font-headline-md text-headline-md mb-4">{p.name}</h3>
                                <div className="w-full h-4 rounded-full overflow-hidden flex mb-3">
                                    <div className="bg-primary h-full" style={{ width: p.equity + '%' }}></div>
                                    <div className="bg-secondary h-full" style={{ width: p.debt + '%' }}></div>
                                    <div className="bg-amber-500 h-full" style={{ width: p.gold + '%' }}></div>
                                </div>
                                <div className={`flex flex-wrap gap-x-6 gap-y-1 font-label-md text-label-md ${MUTED}`}>
                                    <span><span className="inline-block w-2 h-2 rounded-full bg-primary mr-2"></span>Equity {p.equity}%</span>
                                    <span><span className="inline-block w-2 h-2 rounded-full bg-secondary mr-2"></span>Debt {p.debt}%</span>
                                    <span><span className="inline-block w-2 h-2 rounded-full bg-amber-500 mr-2"></span>Gold {p.gold}%</span>
                                </div>
                            </div>
                        ))}
                    </div>
                    <DisclaimerNote>These are generic illustrations, not personalized recommendations. Allocation should reflect your own goals, timeline, and risk tolerance.</DisclaimerNote>
                </div>
            );
        }

        function SettingsPage({ theme, onToggleTheme, onClearHistory }) {
            return (
                <div className="max-w-2xl mx-auto">
                    <PageHeader icon="settings" title="Settings" subtitle="Manage your app preferences." />
                    <div className="flex flex-col gap-4">
                        <div className={`${CARD} p-6 flex items-center justify-between gap-4`}>
                            <div>
                                <h3 className="font-headline-md text-headline-md mb-1">Appearance</h3>
                                <p className={`font-label-md text-label-md ${MUTED}`}>Switch between light and dark mode.</p>
                            </div>
                            <button onClick={onToggleTheme} className={`px-4 py-2 rounded-lg ${ICON_BOX} hover:opacity-80 text-primary dark:text-primary-fixed-dim font-label-md text-label-md flex items-center gap-2 transition-colors flex-shrink-0`}>
                                <span className="material-symbols-outlined text-lg">{theme === 'dark' ? 'light_mode' : 'dark_mode'}</span>
                                {theme === 'dark' ? 'Light Mode' : 'Dark Mode'}
                            </button>
                        </div>
                        <div className={`${CARD} p-6 flex items-center justify-between gap-4`}>
                            <div>
                                <h3 className="font-headline-md text-headline-md mb-1">Chat Data</h3>
                                <p className={`font-label-md text-label-md ${MUTED}`}>Clear the current conversation from this browser session.</p>
                            </div>
                            <button onClick={onClearHistory} className={`px-4 py-2 rounded-lg ${ICON_BOX} hover:opacity-80 text-error font-label-md text-label-md flex items-center gap-2 transition-colors flex-shrink-0`}>
                                <span className="material-symbols-outlined text-lg">delete</span>
                                Clear
                            </button>
                        </div>
                        <InfoCard title="Privacy">
                            Questions you ask are sent to the assistant to generate an answer, and anonymized usage data (query, latency, response) may be logged for quality monitoring. No personal account or portfolio data is collected.
                        </InfoCard>
                    </div>
                </div>
            );
        }

        function RiskGuidePage() {
            const levels = [
                { label: 'Low', color: 'bg-green-500', desc: 'Principal at low risk — typically overnight or liquid debt funds.' },
                { label: 'Low to Moderate', color: 'bg-lime-500', desc: 'Principal at low to moderate risk — short-duration debt funds.' },
                { label: 'Moderate', color: 'bg-yellow-500', desc: 'Principal at moderate risk — hybrid or balanced advantage funds.' },
                { label: 'Moderately High', color: 'bg-orange-500', desc: 'Principal at moderately high risk — multi-cap or large & mid-cap equity funds.' },
                { label: 'High', color: 'bg-red-500', desc: 'Principal at high risk — mid-cap and small-cap equity funds.' },
                { label: 'Very High', color: 'bg-red-800', desc: 'Principal at very high risk — sectoral, thematic, or small-cap-heavy funds.' },
            ];
            return (
                <div className="max-w-4xl mx-auto">
                    <PageHeader icon="info" title="Risk Guide" subtitle="SEBI requires every mutual fund scheme to display a Riskometer indicating its risk level. Here's what each level generally means." />
                    <div className="flex flex-col gap-3 mb-8">
                        {levels.map((l, i) => (
                            <div key={i} className={`${CARD} p-4 flex items-center gap-4`}>
                                <span className={`w-3 h-3 rounded-full flex-shrink-0 ${l.color}`}></span>
                                <div>
                                    <p className="font-label-md text-label-md font-bold text-on-surface dark:text-[#eef0ef]">{l.label}</p>
                                    <p className={`font-label-md text-label-md ${MUTED}`}>{l.desc}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                    <DisclaimerNote>Mutual fund investments are subject to market risks. Read the scheme information and Riskometer of the specific fund carefully before investing.</DisclaimerNote>
                </div>
            );
        }

        function LegalPage() {
            return (
                <div className="max-w-3xl mx-auto">
                    <PageHeader icon="gavel" title="Legal" subtitle="Please read before using this assistant." />
                    <div className="flex flex-col gap-4">
                        <InfoCard title="Educational Purpose Only">
                            This assistant answers factual questions about mutual funds using publicly available scheme documents. It is not a SEBI-registered investment adviser and does not provide investment advice, recommendations, or opinions.
                        </InfoCard>
                        <InfoCard title="No Advisory Relationship">
                            Nothing in this app should be construed as a solicitation to buy or sell any security. Always consult a qualified financial advisor before making investment decisions.
                        </InfoCard>
                        <InfoCard title="Source of Information">
                            Answers are generated from official fund documents and may not reflect the most recent updates. For authoritative, up-to-date information, refer to the <a href="https://www.amfiindia.com/investor-corner" target="_blank" rel="noreferrer" className="text-primary dark:text-primary-fixed-dim underline">AMFI Investor Education portal</a>.
                        </InfoCard>
                    </div>
                </div>
            );
        }

        function App() {
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [currentPage, setCurrentPage] = useState('chat');
            const [theme, setTheme] = useState(() => localStorage.getItem('theme') || 'light');
            const messagesEndRef = useRef(null);
            const textareaRef = useRef(null);

            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('theme', theme);
            }, [theme]);

            const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));

            const goToChat = () => {
                setMessages([]);
                setCurrentPage('chat');
            };

            const suggestionPills = [
                "What is the exit load for HDFC Small Cap?",
                "Compare ELSS vs Index Funds",
                "How to redeem mutual funds?"
            ];

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages, isLoading]);

            const adjustTextareaHeight = () => {
                if(textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = (textareaRef.current.scrollHeight < 120 ? textareaRef.current.scrollHeight : 120) + 'px';
                }
            };

            const handleInput = (e) => {
                setInputValue(e.target.value);
                adjustTextareaHeight();
            };

            const sendMessage = async (text) => {
                if (!text.trim()) return;
                
                const userMsg = { role: 'user', content: text };
                setMessages(prev => [...prev, userMsg]);
                setInputValue('');
                if(textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                }
                setIsLoading(true);

                try {
                    const response = await fetch('http://localhost:8000/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query: text })
                    });
                    
                    const data = await response.json();
                    setMessages(prev => [...prev, { role: 'assistant', content: data.answer }]);
                } catch (error) {
                    setMessages(prev => [...prev, { role: 'assistant', content: 'Sorry, I encountered a network error connecting to the API.' }]);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                sendMessage(inputValue);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage(inputValue);
                }
            };

            const renderMarkdown = (content) => {
                if (!content) content = '';
                return { __html: marked.parse(content) };
            };

            return (
                <div className="flex w-full h-full">
                    {/* Sidebar */}
                    <nav className="w-sidebar-width h-screen hidden md:flex flex-col bg-surface-container-lowest dark:bg-[#212425] border-r border-outline-variant dark:border-[#3a3f3d] fixed left-0 top-0 z-40">
                        <div className="p-6">
                            <div className="flex items-center gap-4 mb-8">
                                <div className="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center overflow-hidden">
                                    <img alt="User Profile" className="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmLX3jJpM0JNSvJuyb3vttUc0OayENer0hrApP8gAcl_QA9ZiQmr7LHqj5fX4IWFsKF9gbOp_zVPZOF_ew2biNHJ0WU50vJluCUM2UAbzIdEZrIYQon0b3wMr1bt3POj502ls32XSuOJM2IyD7bfz4kABNbRKzkeFEraMOhtgSfa2iznIgf25rQVT0pQkgIe6QDTy0BbjOGEmLFZY7Wzxr--Gi2hw4vpRNx5WxVCnRxuQuPz8q3fUR" />
                                </div>
                                <div>
                                    <h1 className="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Groww</h1>
                                    <p className="font-label-sm text-label-sm text-on-surface-variant">Expert Assistant</p>
                                </div>
                            </div>
                            <button onClick={() => setMessages([])} className={`w-full py-3 px-4 mb-6 rounded-lg ${ICON_BOX} hover:opacity-80 text-primary dark:text-primary-fixed-dim font-label-md text-label-md flex items-center justify-center gap-2 transition-colors`}>
                                <span className="material-symbols-outlined">delete</span>
                                Clear History
                            </button>
                            <div className="flex flex-col gap-2 flex-grow">
                                <NavItem icon="add_comment" label="New Chat" active={currentPage === 'chat'} onClick={goToChat} />
                                <NavItem icon="trending_up" label="Market Trends" active={currentPage === 'market-trends'} onClick={() => setCurrentPage('market-trends')} />
                                <NavItem icon="account_balance" label="Tax Savers" active={currentPage === 'tax-savers'} onClick={() => setCurrentPage('tax-savers')} />
                                <NavItem icon="analytics" label="Portfolio Analysis" active={currentPage === 'portfolio-analysis'} onClick={() => setCurrentPage('portfolio-analysis')} />
                                <NavItem icon="settings" label="Settings" active={currentPage === 'settings'} onClick={() => setCurrentPage('settings')} />
                            </div>
                        </div>
                        <div className="mt-auto p-6 border-t border-outline-variant dark:border-[#3a3f3d]">
                            <div className="flex flex-col gap-2">
                                <NavItem small icon="info" label="Risk Guide" active={currentPage === 'risk-guide'} onClick={() => setCurrentPage('risk-guide')} />
                                <NavItem small icon="gavel" label="Legal" active={currentPage === 'legal'} onClick={() => setCurrentPage('legal')} />
                            </div>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col md:ml-[320px] h-full relative">
                        {/* Header */}
                        <header className="fixed top-0 right-0 w-full md:w-[calc(100%-320px)] z-30 flex justify-between items-center px-4 md:px-8 h-16 bg-surface dark:bg-[#212425] border-b border-outline-variant dark:border-[#3a3f3d] transition-all duration-200">
                            <div className="flex items-center gap-4">
                                <button className="md:hidden text-on-surface-variant">
                                    <span className="material-symbols-outlined">menu</span>
                                </button>
                                <div className="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Mutual Fund AI</div>
                            </div>
                            <div className="flex items-center gap-4">
                                <button className="w-10 h-10 rounded-full hover:bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors">
                                    <span className="material-symbols-outlined">history</span>
                                </button>
                                <button className="w-10 h-10 rounded-full hover:bg-surface-container flex items-center justify-center text-on-surface-variant transition-colors">
                                    <span className="material-symbols-outlined">help_outline</span>
                                </button>
                                <div className="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden ml-2 cursor-pointer border border-outline-variant">
                                    <img alt="User Avatar" className="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8AP7kVgh2wY13xIlh-JpH91U3Z7t3HJQOtyBiPs3CL3RgR7Xcxq0Xjk8uY99-9msihpQLhMURXqQwJRyFMhQjLUnwLLw6lfjnQQcRCKuXPyl39uu74MmtkjASZlVE6Wj-l3UiPJrfUDBjFeXxlXVjQJ_uRVoWNTu4wf1Go0Ln80wwrZDnJXXOdBpjUvvOIerwNaOa0ypx58OzK9cZfxNXo1aDiHPcb9PDm8oPfTqIeZKsYM4NQxTW" />
                                </div>
                            </div>
                        </header>

                        {/* Disclaimer Banner */}
                        <div className="fixed top-16 right-0 w-full md:w-[calc(100%-320px)] z-20 bg-[#FFFBEB] border-l-4 border-error border-b border-outline-variant p-3 px-4 md:px-8 flex items-center gap-3">
                            <span className="material-symbols-outlined text-error">warning</span>
                            <p className="font-label-md text-label-md text-on-surface">⚠️ Disclaimer: Facts-only. No investment advice.</p>
                        </div>

                        {/* Chat Interface */}
                        {currentPage === 'chat' && (
                        <main className="flex-1 flex flex-col pt-32 pb-28 overflow-hidden relative">
                            <div className="flex-1 overflow-y-auto px-4 md:px-gutter py-6 chat-container flex flex-col gap-6 w-full max-w-[800px] mx-auto">

                                {messages.length === 0 ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-center max-w-2xl mx-auto h-full">
                                        <div className="w-16 h-16 bg-surface-container rounded-2xl flex items-center justify-center mb-6 text-primary">
                                            <span className="material-symbols-outlined text-3xl">auto_awesome</span>
                                        </div>
                                        <h2 className="font-headline-lg text-headline-lg mb-4">How can I help you navigate mutual funds today?</h2>
                                        <p className="font-body-md text-body-md text-on-surface-variant mb-10">Ask me anything about schemes, performance metrics, or market basics.</p>
                                        <div className="flex flex-wrap justify-center gap-3">
                                            {suggestionPills.map((pill, idx) => (
                                                <button key={idx} onClick={() => sendMessage(pill)} className="suggestion-pill px-5 py-3 rounded-xl border border-outline-variant bg-surface hover:bg-surface-container-low hover:border-primary-container transition-all font-label-md text-label-md text-on-surface-variant hover:text-primary text-left">
                                                    {pill}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ) : (
                                    messages.map((msg, idx) => (
                                        msg.role === 'user' ? (
                                            <div key={idx} className="self-end flex gap-3 max-w-[85%] items-end flex-row-reverse animate-[fadeIn_0.3s_ease-out]">
                                                <div className="bg-primary-container text-on-primary-container rounded-[24px] rounded-br-sm px-6 py-4 shadow-[0_4px_20px_rgba(0,0,0,0.04)] font-body-md text-body-md whitespace-pre-wrap">
                                                    {msg.content}
                                                </div>
                                            </div>
                                        ) : (
                                            <div key={idx} className="self-start flex gap-3 max-w-[85%] items-end animate-[fadeIn_0.3s_ease-out]">
                                                <div className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0 border border-outline-variant">
                                                    <span className="material-symbols-outlined text-sm text-primary">smart_toy</span>
                                                </div>
                                                <div className="bg-surface-container-lowest rounded-[24px] rounded-bl-sm px-6 py-4 border border-outline-variant shadow-[0_4px_20px_rgba(0,0,0,0.04)] font-body-md text-body-md flex flex-col gap-2">
                                                    <div className="prose prose-sm max-w-none text-on-surface markdown" dangerouslySetInnerHTML={renderMarkdown(msg.content)} />
                                                </div>
                                            </div>
                                        )
                                    ))
                                )}

                                {isLoading && (
                                    <div className="self-start flex gap-3 max-w-[85%] items-end">
                                        <div className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center flex-shrink-0">
                                            <span className="material-symbols-outlined text-sm text-primary">smart_toy</span>
                                        </div>
                                        <div className="bg-surface-container-low rounded-[24px] rounded-bl-sm px-6 py-4 border border-outline-variant/30 flex items-center h-12">
                                            <div className="dot-flashing ml-3"></div>
                                        </div>
                                    </div>
                                )}
                                
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Input Area */}
                            <div className="absolute bottom-0 right-0 w-full bg-gradient-to-t from-surface via-surface to-transparent pt-10 pb-6 px-4 md:px-8 flex justify-center z-20 pointer-events-none">
                                <div className="w-full max-w-[800px] pointer-events-auto">
                                    <form onSubmit={handleSubmit} className="relative group">
                                        <textarea 
                                            ref={textareaRef}
                                            value={inputValue}
                                            onChange={handleInput}
                                            onKeyDown={handleKeyDown}
                                            className="w-full bg-surface-container-lowest border border-outline-variant rounded-2xl py-4 pl-5 pr-14 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary resize-none shadow-[0_4px_20px_rgba(0,0,0,0.04)] transition-shadow" 
                                            placeholder="Ask a factual question about mutual funds..." 
                                            rows="1" 
                                            style={{minHeight: '56px', maxHeight: '120px'}}
                                        ></textarea>
                                        <button 
                                            type="submit"
                                            disabled={!inputValue.trim() || isLoading} 
                                            className="absolute right-3 bottom-3 w-10 h-10 rounded-xl bg-primary-container text-on-primary-container flex items-center justify-center hover:opacity-90 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            <span className="material-symbols-outlined">arrow_upward</span>
                                        </button>
                                    </form>
                                    <p className="text-center font-label-sm text-label-sm text-on-surface-variant mt-3">Information provided is for educational purposes only.</p>
                                </div>
                            </div>
                        </main>
                        )}

                        {currentPage !== 'chat' && (
                        <main className="flex-1 overflow-y-auto pt-32 pb-12 px-4 md:px-8">
                            {currentPage === 'market-trends' && <MarketTrendsPage />}
                            {currentPage === 'tax-savers' && <TaxSaversPage />}
                            {currentPage === 'portfolio-analysis' && <PortfolioAnalysisPage />}
                            {currentPage === 'settings' && <SettingsPage theme={theme} onToggleTheme={toggleTheme} onClearHistory={() => setMessages([])} />}
                            {currentPage === 'risk-guide' && <RiskGuidePage />}
                            {currentPage === 'legal' && <LegalPage />}
                        </main>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
